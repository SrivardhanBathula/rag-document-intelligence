embedding:
  model: openai-large          # openai-large | openai-small | bge-large | bge-base
  batch_size: 64
  cache_dir: .cache/embeddings

chunking:
  strategy: recursive           # recursive | semantic
  chunk_size: 512
  chunk_overlap: 64

retrieval:
  top_k: 5
  fetch_k: 20
  use_reranker: true
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  rrf_k: 60

generation:
  model: gpt-4o
  temperature: 0.0
  max_tokens: 1024
  faithfulness_check: true
  faithfulness_threshold: 0.85

vector_store:
  backend: faiss                # faiss | pinecone | opensearch
  index_path: data/faiss_index
  dimension: 3072

api:
  host: 0.0.0.0
  port: 8000
  workers: 2
  max_upload_size_mb: 50
